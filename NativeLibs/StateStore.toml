[library]
name = "kirastatestore"
link_mode = "static"
abi = "c"

[headers]
entrypoint = "StateStore/kira_state_store.h"
include_dirs = ["StateStore"]

[autobinding]
module = "state_store"
output = "../Bindings/state_store/state_store.kira"
headers = ["StateStore/kira_state_store.h"]

[bindings]
mode = "all_public"

# Ambient key -> pointer slots backing the Kira UI `@State` property wrapper. Values are opaque
# Kira-runtime pointers (`nativeState` handles); the store owns only its copied keys.
[build]
sources = ["StateStore/kira_state_store.c"]
include_dirs = ["StateStore"]

[target.x86_64-windows-msvc]
static_lib = "../generated/native/x86_64-windows-msvc/kirastatestore.lib"

[target.x86_64-linux-gnu]
static_lib = "../generated/native/x86_64-linux-gnu/libkirastatestore.a"

[target.aarch64-macos-none]
static_lib = "../generated/native/aarch64-macos/libkirastatestore.a"

[target.aarch64-ios-none]
static_lib = "../generated/native/aarch64-ios/libkirastatestore.a"

[target.aarch64-ios-simulator]
static_lib = "../generated/native/aarch64-ios-simulator/libkirastatestore.a"
