[library]
name = "kiraicon"
link_mode = "static"
abi = "c"

[headers]
entrypoint = "Icon/kira_icon.h"
include_dirs = ["Icon"]

[autobinding]
module = "icon"
output = "../Bindings/icon/icon.kira"
headers = ["Icon/kira_icon.h"]

[bindings]
mode = "all_public"

# SVG-subset icon rasterizer: coverage-only bitmaps for the batched compositor's
# glyph atlas (tinted at draw like text). See Icon/kira_icon.c for the subset.
[build]
sources = ["Icon/kira_icon.c"]
include_dirs = ["Icon"]

[target.x86_64-windows-msvc]
static_lib = "../generated/native/x86_64-windows-msvc/kiraicon.lib"

[target.x86_64-linux-gnu]
static_lib = "../generated/native/x86_64-linux-gnu/libkiraicon.a"

[target.aarch64-macos-none]
static_lib = "../generated/native/aarch64-macos/libkiraicon.a"

[target.aarch64-ios-none]
static_lib = "../generated/native/aarch64-ios/libkiraicon.a"

[target.aarch64-ios-simulator]
static_lib = "../generated/native/aarch64-ios-simulator/libkiraicon.a"
