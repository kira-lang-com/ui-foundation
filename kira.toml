[package]
name = "KiraUIFoundation"
version = "0.1.0"
kind = "library"
kira = "0.1.0"
module_root = "KiraUIFoundation"
native_libraries = ["NativeLibs/Text.toml", "NativeLibs/StateStore.toml", "NativeLibs/Icon.toml"]

[defaults]
execution_mode = "llvm"
build_target = "host"

[dependencies]
KiraLayout = { path = "../kira-layout" }
KiraGraphics = { path = "../kira-graphics" }
